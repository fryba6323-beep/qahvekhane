name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm install

      - name: Prepare offline web files
        run: node prepare.js

      - name: Create Android project
        run: npx cap add android

      - name: Set app icon
        run: |
          SRC=$(ls *.png *.jpg *.jpeg *.webp 2>/dev/null | head -n1 || true)
          if [ -n "$SRC" ]; then
            echo "Using icon: $SRC"
            sudo apt-get update -y
            sudo apt-get install -y imagemagick
            RES=android/app/src/main/res
            rm -rf $RES/mipmap-anydpi-v26
            for p in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
              set -- $p
              convert "$SRC[0]" -resize "${2}x${2}^" -gravity center -extent "${2}x${2}" "$RES/mipmap-$1/ic_launcher.png"
              cp "$RES/mipmap-$1/ic_launcher.png" "$RES/mipmap-$1/ic_launcher_round.png"
            done
          else
            echo "No image found in repo root; keeping default icon"
          fi

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qahvekhane-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
