<style>
:root{--ink:#141a36;--panel:#1f2750;--panel2:#2a3465;--gold:#e6b04a;--turq:#35b3ad;--madder:#c2434d;--text:#f3ead2;--mute:#b9b7cf}
*{box-sizing:border-box}
body{margin:0;background-color:#0f1330;background-image:radial-gradient(circle at 20px 20px,rgba(230,176,74,.08) 2px,transparent 3px);background-size:40px 40px;color:var(--text);font-family:'Vazirmatn','Noto Naskh Arabic',Tahoma,sans-serif;line-height:1.9;font-size:16px}
#app{max-width:760px;margin:0 auto;padding:10px 12px 48px}
h1,h2,h3{margin:0 0 6px;font-weight:800;line-height:1.5}
h1{font-size:30px;color:var(--gold)}
h3{font-size:19px;color:var(--gold)}
p{margin:6px 0}
small{color:var(--mute);font-size:13px}
.hud{display:grid;grid-template-columns:repeat(auto-fit,minmax(74px,1fr));gap:6px;margin-bottom:6px}
.hud>div{background:var(--panel);border:1px solid rgba(230,176,74,.4);border-radius:10px;padding:4px 8px;text-align:center;line-height:1.5}
.hud small{display:block}
.hud b{font-size:15px}
.hud .hot b{color:#ff8a8a}
.days{display:flex;align-items:center;gap:6px;margin:6px 2px 8px;font-size:13px;color:var(--mute);flex-wrap:wrap}
.days i{width:12px;height:12px;background:#3a4480;transform:rotate(45deg);border-radius:2px;flex:none}
.days i.past{background:var(--turq)}
.days i.now{background:var(--gold);box-shadow:0 0 0 3px rgba(230,176,74,.35)}
.days span{margin-inline-end:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}
.chip{background:#141a36;border:1px solid rgba(53,179,173,.6);border-radius:20px;padding:0 10px;font-size:14px}
.stage{position:relative;width:100%;aspect-ratio:16/10;max-height:440px;border-radius:14px;border:2px solid var(--gold);background:#0d1230;overflow:hidden}
.stage.fb{aspect-ratio:800/330}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y;outline:none}
.stage svg.scene{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:0}
.lbl2{position:absolute;transform:translate(-50%,-50%);background:rgba(20,26,54,.82);color:var(--text);border:1px solid var(--gold);border-radius:14px;padding:0 10px;font:inherit;font-size:13px;line-height:1.7;cursor:pointer;white-space:nowrap}
.lbl2.off{opacity:.45}
.lbl2:hover{background:var(--gold);color:#241a08}
.bl{cursor:pointer}
.bl:hover .lb{stroke:var(--gold);stroke-width:2}
.bl.closed{opacity:.55}
.walker{animation:wr linear infinite;pointer-events:none}
.walker.l{animation-name:wl}
@keyframes wr{from{transform:translateX(-90px)}to{transform:translateX(880px)}}
@keyframes wl{from{transform:translateX(880px)}to{transform:translateX(-90px)}}
.steam{animation:st 3s ease-in-out infinite}
@keyframes st{0%,100%{opacity:.15}50%{opacity:.7}}
.panel{background:var(--panel);border:1px solid rgba(230,176,74,.45);border-radius:16px;padding:14px;margin-top:10px}
.note{background:#3a2a55;border-inline-start:5px solid var(--gold);border-radius:10px;padding:8px 12px;margin-top:10px}
.decree{background:#12183a;border:2px solid var(--gold);border-radius:8px;padding:10px 14px;font-weight:700;font-size:18px}
.btn{display:block;width:100%;text-align:right;background:var(--panel2);color:var(--text);border:1px solid rgba(230,176,74,.5);border-radius:12px;padding:8px 14px;font:inherit;cursor:pointer;margin:7px 0}
.btn small{display:block;line-height:1.5}
.btn:hover:not(:disabled){background:#38468f}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--gold);color:#241a08;font-weight:800;border-color:#f6d385}
.btn.primary:hover:not(:disabled){background:#f0c264}
.btn.danger{border-color:var(--madder)}
.btn.slim{display:inline-block;width:auto;margin:0;padding:2px 12px}
button:focus-visible{outline:3px solid var(--turq);outline-offset:2px}
.niche{width:160px;height:210px;margin:6px auto 10px;border:4px solid var(--gold);border-radius:80px 80px 8px 8px;background:linear-gradient(#2a9d9a,#175a70);display:flex;align-items:flex-end;justify-content:center;overflow:hidden;box-shadow:inset 0 0 0 5px #143f5a}
.speech{background:#12183a;border-radius:12px;padding:8px 12px;margin:8px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.three .btn{text-align:center;padding:4px 6px;font-size:14px}
.jr{position:fixed;inset:0;background:rgba(8,10,28,.94);overflow:auto;padding:14px;z-index:10}
.jr .in{max-width:680px;margin:0 auto}
.tabs{display:flex;gap:6px;margin:8px 0}
.tabs button{flex:1;padding:4px 6px;border-radius:10px;border:1px solid rgba(230,176,74,.5);background:var(--panel);color:var(--text);font:inherit;cursor:pointer}
.tabs button.on{background:var(--gold);color:#241a08;font-weight:800}
.person{background:var(--panel);border:1px solid rgba(230,176,74,.45);border-radius:14px;padding:10px 14px;margin:10px 0}
.person ul{margin:6px 0;padding-inline-start:20px}
.tag{background:var(--madder);color:#fff;border-radius:6px;padding:0 6px;font-size:12px;margin-inline-end:6px}
.tag.ok{background:#2a6d5a}
.bar{height:10px;background:#12183a;border-radius:6px;overflow:hidden;margin:2px 0 8px}
.bar i{display:block;height:100%;background:var(--turq)}
.bar.c i{background:var(--gold)}.bar.s i{background:var(--madder)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.opt small{color:#f0c264}
@media (prefers-reduced-motion:reduce){.walker,.steam{animation:none}}
@media (max-width:420px){h1{font-size:25px}.hud b{font-size:14px}.stage{aspect-ratio:4/3}.stage.fb{aspect-ratio:800/330}}
</style>
</head>

function figure(l){
 const skin=l.skin||'#dfb58c', bc=l.bc||'#222';
 let hat='';
 switch(l.hat){
  case 'kolah': hat=`<path d="M33 41 L36 6 Q50 0 64 6 L67 41 Q50 34 33 41Z" fill="${l.hc||'#2b2320'}"/>`;break;
  case 'amameh': hat=`<ellipse cx="50" cy="33" rx="23" ry="13" fill="#f1ecdc"/><ellipse cx="50" cy="28" rx="16" ry="8" fill="#e2dac2"/><path d="M28 36 Q50 42 72 36" stroke="#2a9d9a" stroke-width="3" fill="none"/>`;break;
  case 'top': hat=`<rect x="36" y="6" width="28" height="30" rx="2" fill="#151515"/><rect x="26" y="34" width="48" height="6" rx="3" fill="#151515"/><rect x="36" y="27" width="28" height="4" fill="#8b1e2d"/>`;break;
  case 'soldier': hat=`<path d="M33 41 L35 2 Q50 -4 65 2 L67 41 Q50 34 33 41Z" fill="#3a2a22"/><rect x="34" y="28" width="32" height="6" fill="#c2434d"/><circle cx="50" cy="16" r="4" fill="#e6b04a"/>`;break;
  case 'dervish': hat=`<path d="M33 40 L50 -6 L67 40 Q50 33 33 40Z" fill="#35b3ad"/><path d="M38 30 Q50 25 62 30" stroke="#e6b04a" stroke-width="2.5" fill="none"/>`;break;
  case 'helmet': hat=`<path d="M28 40 Q50 2 72 40Z" fill="#e6d9b8"/><rect x="24" y="38" width="52" height="5" rx="2.5" fill="#d3c497"/>`;break;
  case 'beret': hat=`<ellipse cx="52" cy="30" rx="22" ry="9" fill="#c2434d"/><circle cx="52" cy="20" r="2" fill="#c2434d"/>`;break;
  default: hat=`<path d="M35 40 Q50 22 65 40Z" fill="#efe8d4"/>`;
 }
 const beard=l.beard==='full'?`<path d="M35 52 Q50 96 65 52 Q50 64 35 52Z" fill="${bc}"/>`:'';
 const stache=l.beard!=='none'?`<path d="M41 58 Q50 53 59 58 Q50 62 41 58Z" fill="${bc}"/>`:'';
 return `<path d="M18 130 L25 80 Q50 66 75 80 L82 130Z" fill="${l.robe}"/>
 <rect x="24" y="106" width="52" height="8" fill="${l.sash||'#c2434d'}"/>
 <rect x="43" y="62" width="14" height="14" fill="${skin}"/>
 <circle cx="50" cy="48" r="16" fill="${skin}"/>${beard}${stache}
 <circle cx="44" cy="46" r="1.8" fill="#222"/><circle cx="56" cy="46" r="1.8" fill="#222"/>
 <path d="M40 41 L47 42 M60 41 L53 42" stroke="${bc}" stroke-width="1.6"/>${hat}`;
}
function portrait(l,w,label){return `<svg viewBox="0 0 100 130" width="${w}" role="img" aria-label="${label||'مشتری'}">${figure(l)}</svg>`;}

 const closed=night&&b.id!=='coffee'&&b.id!=='home';
 let roof='';
 if(b.roof==='dome')roof=`<path d="M${b.x+18} ${y} Q${cx} ${y-56} ${b.x+b.w-18} ${y}Z" fill="#2a9d9a"/><rect x="${cx-2}" y="${y-68}" width="4" height="16" fill="#e6b04a"/>`;
 if(b.roof==='badgir')roof=`<rect x="${cx-14}" y="${y-34}" width="28" height="34" fill="${b.c}"/><path d="M${cx-14} ${y-34} L${cx} ${y-48} L${cx+14} ${y-34}Z" fill="#7a4a2a"/><g stroke="#3a2418" stroke-width="2"><line x1="${cx-7}" y1="${y-28}" x2="${cx-7}" y2="${y-4}"/><line x1="${cx}" y1="${y-28}" x2="${cx}" y2="${y-4}"/><line x1="${cx+7}" y1="${y-28}" x2="${cx+7}" y2="${y-4}"/></g>`;
 if(b.roof==='flat')roof=`<rect x="${b.x-4}" y="${y-8}" width="${b.w+8}" height="8" fill="#7a4a2a"/>`;
 if(b.roof==='minaret')roof=`<rect x="${b.x+b.w-26}" y="${y-58}" width="10" height="58" fill="#35b3ad"/><circle cx="${b.x+b.w-21}" cy="${y-63}" r="8" fill="#35b3ad"/><rect x="${b.x-4}" y="${y-8}" width="${b.w+8}" height="8" fill="#5a3f6e"/>`;
 if(b.roof==='flag')roof=`<rect x="${b.x-4}" y="${y-8}" width="${b.w+8}" height="8" fill="#34506e"/><line x1="${cx}" y1="${y-8}" x2="${cx}" y2="${y-56}" stroke="#3a2418" stroke-width="3"/><path d="M${cx} ${y-56} l34 8 l-34 8Z" fill="#c2434d"/><circle cx="${cx+13}" cy="${y-48}" r="3" fill="#e6b04a"/>`;
 let tiles='';
 for(let i=0;i<Math.floor(b.w/12);i++){const tx=b.x+7+i*12;tiles+=`<rect x="${tx-3}" y="${y+3}" width="6" height="6" fill="#e6b04a" transform="rotate(45 ${tx} ${y+6})"/>`;}
 const dim=night?.5:ph===2?.85:1;
 const body=`<g style="filter:brightness(${dim})"><rect class="lb" x="${b.x}" y="${y}" width="${b.w}" height="${b.h}" fill="${b.c}"/>${roof}<rect x="${b.x}" y="${y}" width="${b.w}" height="12" fill="#2a9d9a"/>${tiles}<path d="M${cx-14} 250 V208 Q${cx} 186 ${cx+14} 208 V250Z" fill="#2a1a12"/></g>`;
 const wf=lit?'#ffcf5a':'#3a2a20';
 const wins=`<rect x="${b.x+14}" y="${y+28}" width="14" height="20" rx="7" fill="${wf}"/><rect x="${b.x+b.w-28}" y="${y+28}" width="14" height="20" rx="7" fill="${wf}"/>`;
 let extra='';
 if(b.id==='coffee')extra=`<rect x="${cx+30}" y="224" width="12" height="18" rx="4" fill="#c8873a"/><path class="steam" d="M${cx+36} 220 q6 -8 0 -16 q-6 -8 0 -16" stroke="#fff" stroke-width="2.5" fill="none"/>`;
 return `<g class="bl${closed?' closed':''}" onclick="go('${b.id}')">${body}${wins}${extra}${label(cx,b.name)}</g>`;
}
function scene(){
 const ph=S.phase,night=ph===3;
 const sk=[['#8fd0d8','#f7cf8a'],['#3aa7c9','#c4e8ee'],['#6a4a8f','#f08b5b'],['#0d1230','#2b3170']][ph];
 let sun='';
 if(ph===0)sun='<circle cx="130" cy="130" r="26" fill="#ffe08a"/>';
 if(ph===1)sun='<circle cx="400" cy="50" r="24" fill="#fff3b0"/>';
 if(ph===2)sun='<circle cx="690" cy="140" r="30" fill="#ffb066"/>';
 if(ph===3)sun='<circle cx="640" cy="60" r="22" fill="#f4efd8"/><circle cx="651" cy="54" r="19" fill="#0f1533"/>'+STARS.map(s=>`<circle cx="${s[0]}" cy="${s[1]}" r="1.6" fill="#fff" opacity=".8"/>`).join('');
 let sky='';
 const col=night?'#1a2050':'#7a6aa0';
 for(let i=0;i<8;i++){const x=40+i*105;sky+=`<path d="M${x-34} 200 Q${x} 150 ${x+34} 200Z" fill="${col}" opacity=".55"/>`;if(i%3===1)sky+=`<rect x="${x+40}" y="140" width="6" height="60" fill="${col}" opacity=".55"/><circle cx="${x+43}" cy="137" r="6" fill="${col}" opacity=".55"/>`;}
 const fountain=`<g class="bl" onclick="go('square')"><ellipse class="lb" cx="612" cy="262" rx="46" ry="12" fill="#35b3ad"/><ellipse cx="612" cy="259" rx="36" ry="8" fill="#7fd0d4"/><path d="M612 259 V222" stroke="#bfe9e3" stroke-width="4"/><path d="M612 222 q-14 4 -22 22 M612 222 q14 4 22 22" stroke="#bfe9e3" fill="none" stroke-width="2"/>${label(612,'سبزه‌میدان')}</g>`;
 const walkers=WALK.map(w=>`<g class="walker${w.dir<0?' l':''}" style="animation-duration:${w.dur}s;animation-delay:${w.del}s"><g transform="${w.dir>0?`translate(0,${w.y})`:`translate(34,${w.y})`} scale(${w.dir>0?.34:-.34},.34)">${figure(w.look)}</g></g>`).join('');
 return `<svg class="scene" viewBox="0 0 800 330" role="img" aria-label="کوچهٔ تهران قدیم">
 <defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sk[0]}"/><stop offset="1" stop-color="${sk[1]}"/></linearGradient></defs>
 <rect width="800" height="330" fill="url(#sk)"/>${sun}${sky}
 <rect y="250" width="800" height="80" fill="${night?'#2b2645':'#c9a36b'}"/>
 <rect y="250" width="800" height="5" fill="${night?'#1c1836':'#a98549'}"/>
 ${BLD.map(b=>bldSVG(b,night,ph)).join('')}${fountain}
 <g style="filter:brightness(${night?.6:1})">${walkers}</g></svg>`;
}

function cvs(w,h,fn){

 const g=c.getContext('2d');fn(g,w,h);
 const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=4;return t;
}
function spk(g,w,h,n,light){for(let i=0;i<n;i++){g.fillStyle=light?`rgba(255,255,255,${rr(.03,.1)})`:`rgba(0,0,0,${rr(.03,.12)})`;g.fillRect(rr(0,w),rr(0,h),rr(1,3),rr(1,3));}}
function plasterTex(base){return cvs(256,256,(g,w,h)=>{g.fillStyle=base;g.fillRect(0,0,w,h);for(let i=0;i<70;i++){g.fillStyle=`rgba(${Math.random()<.5?'80,60,30':'255,240,210'},${rr(.03,.09)})`;g.beginPath();g.arc(rr(0,w),rr(0,h),rr(4,26),0,7);g.fill();}spk(g,w,h,800,0);spk(g,w,h,400,1);});}
function signTex(txt,bg,fg){return cvs(256,96,(g,w,h)=>{g.fillStyle=bg;g.fillRect(0,0,w,h);g.strokeStyle='#e6b04a';g.lineWidth=5;g.strokeRect(6,6,w-12,h-12);g.fillStyle=fg;g.font='bold 44px Vazirmatn,Tahoma,serif';g.textAlign='center';g.textBaseline='middle';g.direction='rtl';g.fillText(txt,w/2,h/2+3);});}

const P2=a=>a.map(p=>new THREE.Vector2(p[0],p[1]));
const SM=(a,n)=>new THREE.SplineCurve(P2(a)).getPoints(n);
function add(par,geo,mat,x,y,z){const m=new THREE.Mesh(geo,mat);m.position.set(x||0,y||0,z||0);m.castShadow=true;m.receiveShadow=true;par.add(m);return m;}
const bx=(p,w,h,d,mat,x,y,z)=>add(p,new THREE.BoxGeometry(w,h,d),mat,x,y,z);
const cy=(p,rt,rb,h,mat,x,y,z,seg)=>add(p,new THREE.CylinderGeometry(rt,rb,h,seg||16),mat,x,y,z);
const lt=(p,pts,mat,x,y,z,seg,sm)=>add(p,new THREE.LatheGeometry(sm?SM(pts,sm):P2(pts),seg||24),mat,x,y,z);
function uvBox(geo,w,h,d){const uv=geo.attributes.uv,dm=[[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]];for(let f=0;f<6;f++)for(let v=0;v<4;v++){const i=f*4+v;uv.setXY(i,uv.getX(i)*dm[f][0],uv.getY(i)*dm[f][1]);}uv.needsUpdate=true;}
function pgeo(w,h,tile){const g=new THREE.PlaneGeometry(w,h);if(tile){const uv=g.attributes.uv;for(let i=0;i<uv.count;i++)uv.setXY(i,uv.getX(i)*w/tile,uv.getY(i)*h/tile);uv.needsUpdate=true;}return g;}
function wbox(p,w,h,d,mat,x,y,z){const g=new THREE.BoxGeometry(w,h,d);uvBox(g,w,h,d);return add(p,g,mat,x,y,z);}
function archPath(cx,y0,w,h,pointed,Ctor){
 const p=new (Ctor||THREE.Path)(),x0=cx-w/2,x1=cx+w/2,r=w/2,ys=y0+h-r*(pointed?1.1:1);
 p.moveTo(x0,y0);p.lineTo(x0,ys);
 if(pointed){p.quadraticCurveTo(x0,ys+r*.95,cx,y0+h);p.quadraticCurveTo(x1,ys+r*.95,x1,ys);}
 else p.absarc(cx,ys,r,Math.PI,0,true);
 p.lineTo(x1,y0);p.lineTo(x0,y0);return p;
}
function shell(id,w,h,d,wallMat,holes,depth){
 const g=new THREE.Group();g.userData.place=id;depth=depth||.7;
 const sh=new THREE.Shape();sh.moveTo(-w/2,0);sh.lineTo(w/2,0);sh.lineTo(w/2,h);sh.lineTo(-w/2,h);sh.lineTo(-w/2,0);
 holes.forEach(o=>sh.holes.push(archPath(o.x,o.y,o.w,o.h,o.p)));
 const fm=new THREE.Mesh(new THREE.ExtrudeGeometry(sh,{depth:depth,bevelEnabled:false,curveSegments:14}),wallMat);

function bake(root,scene){
 root.updateMatrixWorld(true);
 const by=new Map(),rm=[];
 root.traverse(o=>{
  if(!o.isMesh)return;
  let p=o,k=false;while(p){if(p.userData&&p.userData.keep){k=true;break;}p=p.parent;}
  if(k)return;
  const a=by.get(o.material)||[];a.push(o);by.set(o.material,a);rm.push(o);
 });
 const place=root.userData.place;
 by.forEach((list,mat)=>{
  let n=0;const gs=list.map(m=>{const g0=m.geometry.index?m.geometry.toNonIndexed():m.geometry.clone();g0.applyMatrix4(m.matrixWorld);n+=g0.attributes.position.count;return g0;});
  const pos=new Float32Array(n*3),nor=new Float32Array(n*3),uv=new Float32Array(n*2);let o3=0,o2=0;
  gs.forEach(g0=>{pos.set(g0.attributes.position.array,o3);nor.set(g0.attributes.normal.array,o3);if(g0.attributes.uv)uv.set(g0.attributes.uv.array,o2);o3+=g0.attributes.position.count*3;o2+=g0.attributes.position.count*2;g0.dispose();});
  const bg=new THREE.BufferGeometry();
  bg.setAttribute('position',new THREE.BufferAttribute(pos,3));bg.setAttribute('normal',new THREE.BufferAttribute(nor,3));bg.setAttribute('uv',new THREE.BufferAttribute(uv,2));
  const m=new THREE.Mesh(bg,mat);m.castShadow=true;m.receiveShadow=true;if(place)m.userData.place=place;scene.add(m);
 });
 rm.forEach(m=>{m.parent.remove(m);m.geometry.dispose();});
}

function buildQueue(){
 const base=Math.floor(diff()/2)+[1,2,3,2][S.phase]+(S.upg.naghal?1:0)+(S.mods.extra||0)+(S.rep>=65?1:0)+(S.fac.people>=60?1:0)-(S.rep<25?1:0);
 const n=clamp(base,1,5);
 const rc=id=>S.recent.includes(id)?1:0;
 const pool=ORD.slice().sort((a,b)=>(rc(a.id)-rc(b.id))||(Math.random()-.5)).slice(0,n);
 S.recent=pool.map(p=>p.id);
 const q=pool.slice();
 if(S.mods.soldiers)q.push(SOLDIER);
 if(S.mods.inspection&&!S.inspected&&S.phase>=1){q.push(INSPECTOR);S.inspected=true;}
 Object.keys(P).forEach(id=>{
  const p=P[id];
  if(S.arrested[id]||S.gone[id]||S.day<p.from||S.phase<p.ph)return;
  if(p.foreign&&S.mods.noForeign)return;
  let pr=S.away[id]?.15:.5+.03*diff();
  if(S.mods.spyBoost)pr+=.2;
  if(Math.random()<Math.min(pr,.85))q.splice(Math.floor(Math.random()*(q.length+1)),0,p);
 });
 S.queue=q.slice(0,6);
}
function nextCustomer(){
 if(!S.queue.length){S.cur=null;render();return;}
 const p=S.queue.shift();
 S.cur={p,served:false,talked:false,msg:'',msg2:'',greet:rnd(p.g),n:++S.cn};
 if(p.role==='spy'||p.role==='decoy')S.met[p.id]=true;
 if(p.role==='inspector'){
  if(S.heat>=60){arrest('بازرس زیر کف قهوه‌خانه‌ات چیزهای مشکوکی پیدا کرد.');render();return;}
  if(S.rep>=45){S.coins+=5;S.rep=clamp(S.rep+2,0,100);S.cur.msg='بازرس دور تا دور قهوه‌خانه را نگاه کرد و سر تکان داد: «آفرین، تمیز و مرتب.» انعامی هم گذاشت. (+۵ قران، +۲ اعتبار)';}
  else{S.coins=Math.max(0,S.coins-8);S.rep=clamp(S.rep-2,0,100);S.cur.msg='بازرس اخم کرد: «این‌جا سر و سامان ندارد!» و جریمه‌ات کرد. (−۸ قران، −۲ اعتبار)';}
  S.cur.served=true;S.cur.talked=true;
 }
 render();
}
function skip(){S.rep=clamp(S.rep-1,0,100);nextCustomer();}
function sellPrice(k){return Math.max(1,ITEMS[k].sell+(S.mods.priceDelta||0)+(k==='tea'?(S.mods.teaSell||0):0));}
function serve(k){
 const c=S.cur;if(!c||c.served)return;const p=c.p;
 if(S.stock[k]<1||(k==='qalyan'&&S.mods.noQalyan))return;
 S.stock[k]--;
 const price=p.free?0:sellPrice(k);
 let gainC=price;const liked=p.likes===k;
 if(liked){gainC+=1+(S.upg.farsh?1:0)+(S.mods.tipBonus||0);S.rep=clamp(S.rep+1,0,100);addXp(2);}
 S.st.served++;
 if(p.free)S.rep=clamp(S.rep+2,0,100);
 S.coins+=gainC;
 if(liked){S.pref[p.id]=k;if(p.role==='spy'||p.role==='decoy')S.trust[p.id]=(S.trust[p.id]||0)+1;}
 const g=p.free?'(اعتبارت بالا رفت)':`(+${FA(gainC)} قران)`;
 c.msg=liked?`${p.name} فنجان را گرفت و لبخند زد؛ انگار همین را می‌خواست. ${g}`:`${p.name} بی‌حرف نوشید. ${g}`;
 if((p.role==='spy'||p.role==='decoy')&&S.sk.wits>0&&Math.random()<.07*S.sk.wits){const r=reveal(p.id,'تیزبینی');if(r)c.msg2='چیزی توجهت را جلب کرد. '+r;}
 c.served=true;render();
}
function talk(){
 const c=S.cur;if(!c||!c.served||c.talked)return;const p=c.p;
 c.talked=true;let m='';
 if(p.role==='plain'){
  const ev=p.ask&&EV[p.ask];
  if(ev&&!S.evUsed[p.ask]&&(!ev.cond||ev.cond())&&Math.random()<.6){openEvent(p.ask,'coffee');return;}
  const idx=S.said[p.id]||0;S.said[p.id]=idx+1;
  const dr=DR[S.dec&&S.dec.id];
  m=(dr&&Math.random()<.3)?dr:p.lines[idx%p.lines.length];
  const chance=.28+(S.mods.royalWatch?.15:0)+.04*S.sk.wits;
  if(!p.free&&Math.random()<chance){const r=revealRandom('شایعه');if(r)m+=' — و زیر لب گفت: '+r;}
 }else{
  const arr=S.clues[p.id]||[];
  if(arr.length>=p.clues.length)m='دیگر چیزی برای گفتن ندارد.';
  else if((S.trust[p.id]||0)>arr.length||Math.random()<.16*S.sk.charm){m='گرم گرفت و حرف زد. '+reveal(p.id,'گفتگو');addXp(4);}
  else{
   S.alert[p.id]=(S.alert[p.id]||0)+1;
   if(S.alert[p.id]>=3){S.away[p.id]=true;m='نگاهش تیز شد. انگار دیگر کمتر سر می‌زند…';}
   else m='هنوز به تو اعتماد ندارد؛ بحث را عوض کرد. (اعتماد = پذیرایی با نوشیدنیِ مورد علاقه‌اش)';
  }
 }
 c.msg2=(c.msg2?c.msg2+' ':'')+m;render();
}
function pool(){

 SPIES.forEach(id=>{if(!S.arrested[id]&&(S.clues[id]||[]).length<P[id].clues.length)out.push(id,id,id);});
 ['jacques','darvish'].forEach(id=>{if(!S.gone[id]&&(S.clues[id]||[]).length<P[id].clues.length)out.push(id);});

function reveal(id,src){
 const p=P[id],arr=S.clues[id]=S.clues[id]||[];
 const c=p.clues[arr.length];
 if(!c)return null;
 arr.push({t:c.t,s:c.s,src});S.met[id]=true;addXp(5);S.st.clues++;
 return `درباره‌ی ${p.name}: ${c.t}`;
}

const VER=2,SAFE=['street','home','decree'];

try{localStorage.setItem('qk2_t','1');localStorage.removeItem('qk2_t');ST.ok=true;}catch(e){ST.ok=false;}
const stGet=k=>{try{if(ST.ok){const v=localStorage.getItem(k);return v===undefined?null:v;}}catch(e){ST.ok=false;}return Object.prototype.hasOwnProperty.call(ST.mem,k)?ST.mem[k]:null;};
const stSet=(k,v)=>{try{if(ST.ok){localStorage.setItem(k,v);return true;}}catch(e){ST.ok=false;}ST.mem[k]=v;return false;};
const stDel=k=>{try{if(ST.ok)localStorage.removeItem(k);}catch(e){}delete ST.mem[k];};
function hsh(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0).toString(16);}
const esc=s=>String(s).replace(/[&<>"'`]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#96;'}[c]));
const b64e=s=>btoa(unescape(encodeURIComponent(s)));
const b64d=s=>decodeURIComponent(escape(atob(s)));
const isObj=x=>x&&typeof x==='object'&&!Array.isArray(x);
const num=(x,d,lo,hi)=>{x=typeof x==='number'&&isFinite(x)?x:d;return clamp(x,lo,hi);};
function pack(kind,payload){const body=JSON.stringify(payload);return JSON.stringify({v:VER,k:kind,t:Date.now(),sum:hsh(body),body:body});}
function unpack(txt,kind){
 try{
  if(typeof txt!=='string'||txt.length>400000)return null;
  const e=JSON.parse(txt);
  if(!isObj(e)||e.k!==kind||typeof e.body!=='string'||e.sum!==hsh(e.body)||!(e.v>=1&&e.v<=VER))return null;
  const p=JSON.parse(e.body);
  return isObj(p)?{t:num(e.t,0,0,4e12),p:p}:null;
 }catch(err){return null;}
}

const TOAST=[];
function checkAch(){
 let ch=false;
 ACH.forEach(a=>{if(META.ach[a.id])return;let ok=false;try{ok=a.ck();}catch(e){ok=false;}if(ok){META.ach[a.id]=Date.now();TOAST.push(`دستاورد تازه: «${a.n}» — ${a.d}`);ch=true;}});
 if(ch)saveMeta();
}
function runScore(){return S.seasonsDone*120+S.st.arrests*40+S.lvl*10+Math.floor(S.coins/5);}
function onRunEnd(){
 const k=S.endKey;
 if(!S.counted){META.runs++;S.counted=true;}
 META.seasons++;
 for(const x in S.st)META.stats[x]+=S.st[x];
 const sc=runScore()+(ENDL[k]||0)*10;
 S.gainLeg=(ENDL[k]||1)+S.lvl+3*S.seasonsDone+2*S.st.arrests;
 META.legacy+=S.gainLeg;META.total+=S.gainLeg;
 META.endings[k]=(META.endings[k]||0)+1;
 if(sc>META.best){META.best=sc;S.newBest=true;}
 S.finalScore=sc;
 for(const x in S.st)S.st[x]=0;
 checkAch();
 saveMeta();
 if(!continuable(k)){stDel(slotKey('auto'));stDel(slotKey('auto')+'_bak');}
}

 }else{
  const n=SPIES.filter(id=>S.arrested[id]).length;
  h+=`<div class="person"><h3>اصلی: جلوی سوءقصد را بگیر</h3><p>سه توطئه‌گر را با مدرک به داروغه معرفی کن. در این فصل تا این‌جا ${FA(n)} از ۳ نفر دستگیر شده‌اند. ${FA(FINAL-S.day)} روز تا سان شاه مانده است.</p></div>`;
  if(S.ring)h+=`<div class="person"><h3>کار برای سایه‌ها</h3><p>در کاروانسرا کار می‌گیری. ظن داروغه: ${FA(S.heat)} از ۱۰۰. مراقب باش لو نروی.</p></div>`;
  if(S.informant)h+=`<div class="person"><h3>مخبر داروغه</h3><p>هر روز می‌توانی از داروغه‌خانه خبر بگیری.</p></div>`;
  if(!S.ring&&!S.informant)h+=`<div class="person"><h3>راه خودت را انتخاب کن</h3><p>در گفتگو با مشکوک‌ها یا در رویدادهای روزانه، می‌توانی به هر طرف کشیده شوی.</p></div>`;
 }
 return h+`${btn('بستن','','toggleJr()',{cls:'primary'})}</div></div>`;
}
function openModal(m){S.modal=m;S.jr=false;S.confirmDel='';render();}
function closeModal(){S.modal=null;S.confirmDel='';render();}
function saveModal(){
 const can=SAFE.includes(S.view);
 let h=`<div class="jr"><div class="in"><h2>ذخیره و بارگذاری</h2>`;
 h+=`<p><small>${ST.ok?'ذخیرهٔ دائمی در مرورگر فعال است.':'ذخیرهٔ دائمی در این محیط ممکن نیست؛ تا بستن صفحه می‌ماند. برای نگه‌داشتن، «کد ذخیره» بساز و جایی یادداشتش کن.'}</small></p>`;
 if(S.view!=='title'&&!can)h+='<p><small>الان وسط یک کار هستی؛ برای ذخیره به کوچه یا خانه برگرد. ذخیرهٔ خودکار هر نوبت انجام می‌شود.</small></p>';
 SLOTS.forEach(k=>{
  const inf=slotInfo(k),manual=(k==='1'||k==='2'||k==='3');
  h+=`<div class="person"><div class="row"><b>${SLN[k]}</b></div><p>${inf||'<small>خالی</small>'}</p><div class="three">`;
  if(manual&&S.view!=='title')h+=`<button class="btn slim" style="width:100%" ${can?'':'disabled'} onclick="doSave('${k}')">ذخیره</button>`;
  h+=`<button class="btn slim" style="width:100%" ${inf?'':'disabled'} onclick="doLoad('${k}')">بارگذاری</button>`;
  if(manual||k==='prev')h+=`<button class="btn slim danger" style="width:100%" ${inf?'':'disabled'} onclick="askDel('${k}')">${S.confirmDel===k?'مطمئنی؟ دوباره بزن':'حذف'}</button>`;
  h+='</div></div>';
 });
 h+=`<div class="person"><h3>کد ذخیره</h3><p><small>کد را جایی یادداشت کن تا بعداً (حتی در مرورگر دیگر) بازی را برگردانی.</small></p>`;
 h+=btn('ساخت کد از بازی فعلی','','makeCode()');
 if(S.exportCode)h+=`<textarea id="code" readonly rows="4" style="width:100%;font:12px monospace;direction:ltr;background:#12183a;color:var(--text);border:1px solid var(--gold);border-radius:8px">${esc(S.exportCode)}</textarea>${btn('کپی کد','','copyCode()')}`;
 h+=`<textarea id="imp" rows="3" placeholder="کد را این‌جا بچسبان (QK2.…)" style="width:100%;font:12px monospace;direction:ltr;background:#12183a;color:var(--text);border:1px solid var(--gold);border-radius:8px;margin-top:8px"></textarea>${btn('وارد کردن و بارگذاری','','importCode()')}</div>`;
 return h+`${btn('بستن','','closeModal()',{cls:'primary'})}</div></div>`;
}
function legacyModal(){
 let h=`<div class="jr"><div class="in"><h2>تالار میراث</h2><p>میراث: <b>${FA(META.legacy)}</b> — رکورد: <b>${FA(META.best)}</b> — بازی‌ها: ${FA(META.runs)} — فصل‌ها: ${FA(META.seasons)}</p>`;
 h+=`<div class="person"><h3>هدیه‌های میراث</h3><p><small>میراث را از پایان‌ها می‌گیری و برای همیشه خرج می‌کنی.</small></p>`;
 PERKS.forEach(x=>{const lv=perkLv(x.id),full=lv>=x.max,c=x.cost*(lv+1);h+=btn(`${x.n} ${'●'.repeat(lv)}${'○'.repeat(x.max-lv)}`,`${x.d}${full?' — کامل':` — ${FA(c)} میراث`}`,`buyPerk('${x.id}')`,{dis:full||META.legacy<c});});
 h+='</div>';
 h+=`<div class="person"><h3>پایان‌ها (${FA(Object.keys(META.endings).length)} از ${FA(Object.keys(ENDN).length)})</h3><ul>${Object.keys(ENDN).map(k=>`<li>${META.endings[k]?`${ENDN[k]} <small>(${FA(META.endings[k])} بار)</small>`:'<small>؟؟؟ هنوز ندیده‌ای</small>'}</li>`).join('')}</ul></div>`;
 const got=ACH.filter(a=>META.ach[a.id]).length;
 h+=`<div class="person"><h3>دستاوردها (${FA(got)} از ${FA(ACH.length)})</h3><ul>${ACH.map(a=>META.ach[a.id]?`<li><span class="tag ok">باز شد</span>${a.n} <small>— ${a.d}</small></li>`:`<li><small>🔒 ${a.d}</small></li>`).join('')}</ul></div>`;
 const st=META.stats;
 h+=`<div class="person"><h3>آمار کل</h3><p><small>روزها ${FA(st.days)} — نوشیدنی ${FA(st.served)} — سرنخ ${FA(st.clues)} — دستگیری ${FA(st.arrests)} — اشتباه ${FA(st.wrong)} — رویداد ${FA(st.events)} — زندان ${FA(st.jails)}</small></p></div>`;
 return h+`${btn('بستن','','closeModal()',{cls:'primary'})}</div></div>`;
}
function setModal(){
 const q=META.set.q3d,o=(v,n)=>btn(n+(q===v?' ✓':''),'',`setQ3d('${v}')`,{cls:q===v?'primary':''});
 return `<div class="jr"><div class="in"><h2>تنظیمات</h2><div class="person"><h3>سه‌بعدی</h3><p><small>اگر بازی روی دستگاهت کند است یا تصویر سه‌بعدی درست نیامد، کیفیت را کم کن یا سه‌بعدی را خاموش کن (کوچهٔ دوبعدی جایگزین می‌شود). تغییر بعد از باز کردن دوبارهٔ صفحه اعمال می‌شود.</small></p>${o('auto','خودکار')}${o('low','کیفیت کم')}${o('off','خاموش (دوبعدی)')}${btn('بازکردن دوبارهٔ صفحه','','reloadPage()')}</div>${btn('بستن','','closeModal()',{cls:'primary'})}</div></div>`;
}
const MODALS={save:saveModal,legacy:legacyModal,set:setModal};
const VIEWS={title:panelTitle,decree:panelDecree,street:panelStreet,coffee:panelCoffee,grocer:panelGrocer,bazaar:panelBazaar,square:panelSquare,home:panelHome,police:panelPolice,hideout:panelHideout,event:panelEvent,end:panelEnd};
function render(){
 const hb=document.getElementById('hudbox'),ui=document.getElementById('ui'),st=document.getElementById('stage');
 if(S.view==='end'&&!S.ended){S.ended=true;try{onRunEnd();}catch(e){console.warn(e);}}
 else if(S.view!=='title'&&S.view!=='end'){try{checkAch();}catch(e){}}
 if(S.view!=='end'){try{autosave();}catch(e){console.warn('autosave',e);}}
 hb.innerHTML=S.view==='title'?'':hud();
 const ln=S.lvlNote;S.lvlNote='';
 const ts=TOAST.splice(0).map(t=>`<div class="note">🏅 ${t}</div>`).join('');
 const mdl=S.modal&&MODALS[S.modal]?MODALS[S.modal]():'';
 ui.innerHTML=ts+(ln?`<div class="note">${ln}</div>`:'')+(S.note?`<div class="note">${S.note}</div>`:'')+VIEWS[S.view]()+(S.jr&&!mdl?journalHTML():'')+mdl;
 st.classList.toggle('fb',!T.ok);
 if(T.ok)set3D();else st.innerHTML=S.view==='end'?'':scene();
}
(function boot(){
 try{loadMeta();}catch(e){META=freshMeta();}
 newGame();
 const st=document.getElementById('stage');
 try{if(META.set.q3d!=='off'&&init3D(st)){if(META.set.q3d==='low')lowQ();render();}}catch(e){console.warn(e);}
})();
</script>
</body>
</html>
